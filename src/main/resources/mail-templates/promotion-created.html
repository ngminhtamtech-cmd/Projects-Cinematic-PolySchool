<p style="margin:0 0 4px;">Xin chào {{name}},</p>
<p style="margin:0 0 16px;">CineBook vừa có ưu đãi mới dành cho bạn.</p>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%; border-collapse:collapse; margin:0 0 16px;">
<tr>
<td style="padding:8px 12px; border:1px solid #e3e5e8; background-color:#f9fafb; font-size:13px; color:#6b7280; width:40%;">Mã ưu đãi</td>
<td style="padding:8px 12px; border:1px solid #e3e5e8; font-size:13px; color:#1f2937;"><strong>{{code}}</strong></td>
</tr>
<tr>
<td style="padding:8px 12px; border:1px solid #e3e5e8; background-color:#f9fafb; font-size:13px; color:#6b7280;">Nội dung</td>
<td style="padding:8px 12px; border:1px solid #e3e5e8; font-size:13px; color:#1f2937;">{{description}}</td>
</tr>
<tr>
<td style="padding:8px 12px; border:1px solid #e3e5e8; background-color:#f9fafb; font-size:13px; color:#6b7280;">Mức giảm</td>
<td style="padding:8px 12px; border:1px solid #e3e5e8; font-size:13px; color:#1f2937;">{{discount}}</td>
</tr>
<tr>
<td style="padding:8px 12px; border:1px solid #e3e5e8; background-color:#f9fafb; font-size:13px; color:#6b7280;">Giảm tối đa</td>
<td style="padding:8px 12px; border:1px solid #e3e5e8; font-size:13px; color:#1f2937;">{{maxDiscount}}</td>
</tr>
<tr>
<td style="padding:8px 12px; border:1px solid #e3e5e8; background-color:#f9fafb; font-size:13px; color:#6b7280;">Hiệu lực đến</td>
<td style="padding:8px 12px; border:1px solid #e3e5e8; font-size:13px; color:#1f2937;">{{endDate}}</td>
</tr>
<tr>
<td style="padding:8px 12px; border:1px solid #e3e5e8; background-color:#f9fafb; font-size:13px; color:#6b7280;">Đối tượng</td>
<td style="padding:8px 12px; border:1px solid #e3e5e8; font-size:13px; color:#1f2937;">{{audience}}</td>
</tr>
</table>

<p style="margin:0; font-size:13px; color:#6b7280;">Nhập mã khi thanh toán để được giảm giá. Mỗi ưu đãi có thể giới hạn số lượt sử dụng.</p>
